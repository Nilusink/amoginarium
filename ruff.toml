# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py312"

[lint]
select = ["ALL"]
preview = true
ignore = [
    # -----------------------------------------------------------
    # 1. FORMATTER CONFLICTS (MANDATORY IGNORES)
    # Ruff officially requires these to be ignored if you use [format]
    # Otherwise, the linter and formatter will undo each other's work.
    # -----------------------------------------------------------
    "COM812", # Missing trailing comma

    # -----------------------------------------------------------
    # 2. MUTUALLY EXCLUSIVE DOCSTRING RULES
    # You physically cannot satisfy both sides of these pairs.
    # -----------------------------------------------------------
    "D212", # Conflicts with D212 (Multi-line summary should start at first line)
    "D203", # Conflicts with D211 (No blank lines allowed before class docstring)

    # -----------------------------------------------------------
    # 3. HIGHLY RECOMMENDED "SANITY" IGNORES FOR FULL STRICT MODE
    # (Uncomment these if the noise gets to be too much)
    # -----------------------------------------------------------
    # "ERA001", # Found commented-out code (very annoying during active debugging)
    # "CPY001", # Missing copyright notice at top of file
    "DOC201", # preview - does not work with restructedText
    "DOC501", # preview - does not work with restructedText
    "CPY001",
    "RUF005",
    "D200",
    "TID252",
    "RUF023",
    "PLR1714", # For speed reasons - using a set is slower,
    "PLR1730", # For speed reasons - using max is slower
    "RUF022",
    "PYI011",
    "PTH",
    "FURB136",
    "BLE001", # we use pycharms warning - also this removes brackets from (Exception,)
    "B013", # same as above,
    "UP015",
    "FURB103", # discuss,
    "FURB101",
    "PLR0913", # dicuss - set max as alternative?
    "FBT001",
    "FBT002",
    "FBT003",
    "PLR6201",
    "ANN401",
    "S311",
    "RUF052"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
